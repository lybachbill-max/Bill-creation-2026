<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1717" viewBox="0 0 900 1717">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker>
<marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<line x1="380" y1="142" x2="380" y2="168" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="224" x2="380" y2="250" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="306" x2="380" y2="332" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="388" x2="380" y2="414" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="504" x2="380" y2="530" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="586" x2="380" y2="612" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="685" x2="380" y2="711" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="570" y1="765" x2="662" y2="765" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#arrR)"/><line x1="380" y1="819" x2="380" y2="853" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="926" x2="380" y2="952" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="570" y1="1006" x2="662" y2="1006" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#arrR)"/><line x1="380" y1="1060" x2="380" y2="1094" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="1167" x2="380" y2="1193" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="1266" x2="380" y2="1292" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="380" y1="1365" x2="380" y2="1391" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><line x1="570" y1="1462" x2="662" y2="1462" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#arrR)"/><line x1="380" y1="1533" x2="380" y2="1567" stroke="#404040" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1F3864">Figure 3 — GS Mark Obtaining Process (TÜV / ZLS-recognised GS body)</text>
<text x="450" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#2F5C85">Hình 3 — Quy trình xin cấp dấu GS (TÜV / tổ chức GS được ZLS công nhận)</text>
<rect x="180" y="86" width="400" height="56" rx="28" fill="#1F3864" stroke="#1F3864" stroke-width="2"/>
<text x="380" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Ally orders GS (e.g. HAGEBAU)</text><text x="380" y="127" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#DCE6F2">Đối tác đặt hàng GS (ví dụ HAGEBAU)</text>
<rect x="180" y="168" width="400" height="56" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="168" r="13" fill="#1F3864"/><text x="180" y="172.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">1</text>
<text x="380" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Define GS scope: models, capacities, Ally brands</text><text x="380" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Xác định phạm vi GS: model, tải trọng, thương hiệu</text>
<text x="588" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">Merchandiser + QS</text>
<rect x="180" y="250" width="400" height="56" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="250" r="13" fill="#1F3864"/><text x="180" y="254.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">2</text>
<text x="380" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Select GS body; quotation + test programme</text><text x="380" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Chọn tổ chức GS; báo giá + chương trình thử</text>
<text x="588" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">QS</text>
<rect x="180" y="332" width="400" height="56" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="332" r="13" fill="#1F3864"/><text x="180" y="336.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">3</text>
<text x="380" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Application signed by manufacturer</text><text x="380" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Nhà sản xuất ký đơn đăng ký (đứng tên chứng nhận)</text>
<text x="588" y="364" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">Supplier / NCC</text>
<rect x="180" y="414" width="400" height="90" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="414" r="13" fill="#1F3864"/><text x="180" y="418.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">4</text>
<text x="380" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Technical documents submitted</text><text x="380" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Drawings · critical components · risk assessment</text><text x="380" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Nộp hồ sơ kỹ thuật</text><text x="380" y="489" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Bản vẽ · linh kiện trọng yếu · HDSD tiếng Đức</text>
<text x="588" y="463" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">Supplier + QS</text>
<rect x="180" y="530" width="400" height="56" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="530" r="13" fill="#1F3864"/><text x="180" y="534.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">5</text>
<text x="380" y="554" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Production-representative samples shipped</text><text x="380" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Gửi mẫu đại diện sản xuất</text>
<text x="588" y="562" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">Supplier / NCC</text>
<rect x="180" y="612" width="400" height="73" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="612" r="13" fill="#1F3864"/><text x="180" y="616.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">6</text>
<text x="380" y="636" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Type test at GS body</text><text x="380" y="653" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">EN ISO 3691-5 · EN 16307-5:2023 · AfPS PAK</text><text x="380" y="670" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Thử mẫu điển hình tại tổ chức GS</text>
<text x="588" y="652.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">GS body / Tổ chức GS</text>
<polygon points="380,711 570,765 380,819 190,765" fill="#FFF2CC" stroke="#B7950B" stroke-width="1.8"/>
<text x="380" y="761" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">GS test report PASS?</text><text x="380" y="778" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Báo cáo thử GS ĐẠT?</text>
<text x="388" y="835" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#38761D">YES / GO</text>
<rect x="662" y="720" width="232" height="90" rx="6" fill="#FBE5E5" stroke="#B03A2E" stroke-width="1.6"/>
<text x="778" y="744" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">CAPA → modified samples</text><text x="778" y="761" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">→ back to step 5</text><text x="778" y="778" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2F5C85">Khắc phục → mẫu sửa</text><text x="778" y="795" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2F5C85">→ quay lại bước 5</text>
<text x="616" y="757" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#B03A2E">NO / KHÔNG</text>
<rect x="180" y="853" width="400" height="73" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="853" r="13" fill="#1F3864"/><text x="180" y="857.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">7</text>
<text x="380" y="877" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Initial factory inspection (before award)</text><text x="380" y="894" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Đánh giá nhà máy lần đầu (trước khi cấp)</text><text x="380" y="911" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Kiểm soát đầu vào · thử tải cuối chuyền · truy xuất</text>
<text x="588" y="893.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">GS body; QS attends</text>
<polygon points="380,952 570,1006 380,1060 190,1006" fill="#FFF2CC" stroke="#B7950B" stroke-width="1.8"/>
<text x="380" y="1002" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Factory inspection PASS?</text><text x="380" y="1019" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Đánh giá nhà máy ĐẠT?</text>
<text x="388" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#38761D">YES / GO</text>
<rect x="662" y="961" width="232" height="90" rx="6" fill="#FBE5E5" stroke="#B03A2E" stroke-width="1.6"/>
<text x="778" y="985" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">Corrective actions</text><text x="778" y="1002" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">→ follow-up inspection</text><text x="778" y="1019" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2F5C85">Hành động khắc phục</text><text x="778" y="1036" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2F5C85">→ đánh giá bổ sung</text>
<text x="616" y="998" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#B03A2E">NO / KHÔNG</text>
<rect x="180" y="1094" width="400" height="73" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="1094" r="13" fill="#1F3864"/><text x="180" y="1098.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">8</text>
<text x="380" y="1118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">GS certificate issued (ProdSG § 20), ≤ 5 years</text><text x="380" y="1135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Cấp chứng nhận GS (ProdSG § 20), ≤ 5 năm</text><text x="380" y="1152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Model · thương hiệu · nhà máy</text>
<text x="588" y="1134.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">GS body / Tổ chức GS</text>
<rect x="180" y="1193" width="400" height="73" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="1193" r="13" fill="#1F3864"/><text x="180" y="1197.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">9</text>
<text x="380" y="1217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">GS mark artwork approved by GS body (§ 24)</text><text x="380" y="1234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Tổ chức GS duyệt maket dấu GS</text><text x="380" y="1251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Chỉ dùng dấu sau khi có chứng nhận</text>
<text x="588" y="1233.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">Supplier + QS</text>
<rect x="180" y="1292" width="400" height="73" rx="6" fill="#E9EFF8" stroke="#1F3864" stroke-width="1.6"/>
<circle cx="180" cy="1292" r="13" fill="#1F3864"/><text x="180" y="1296.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">10</text>
<text x="380" y="1316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Certificate in QC pack · verified online</text><text x="380" y="1333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Lưu chứng nhận trong QC pack · xác minh trực tuyến</text><text x="380" y="1350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Nhà nhập khẩu lập hồ sơ kiểm tra (§ 24)</text>
<text x="588" y="1332.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#595959">QS / importer</text>
<polygon points="380,1391 570,1462 380,1533 190,1462" fill="#FFF2CC" stroke="#B7950B" stroke-width="1.8"/>
<text x="380" y="1441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Change of design, component,</text><text x="380" y="1458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">factory or standard?</text><text x="380" y="1475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">Thay đổi thiết kế, linh kiện,</text><text x="380" y="1492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#2F5C85">nhà máy hoặc tiêu chuẩn?</text>
<text x="388" y="1549" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#38761D">NO → continue / KHÔNG → tiếp tục</text>
<rect x="662" y="1417" width="232" height="90" rx="6" fill="#FBE5E5" stroke="#B03A2E" stroke-width="1.6"/>
<text x="778" y="1441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">Notify GS body BEFORE shipment</text><text x="778" y="1458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">→ re-test / amendment</text><text x="778" y="1475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2F5C85">Báo tổ chức GS TRƯỚC khi giao</text><text x="778" y="1492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2F5C85">→ thử lại / sửa chứng nhận</text>
<text x="616" y="1454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#B03A2E">YES / CÓ</text>
<rect x="180" y="1567" width="400" height="90" rx="45" fill="#E2F0D9" stroke="#38761D" stroke-width="2"/>
<text x="380" y="1591" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1A1A1A">Maintain: annual surveillance,</text><text x="380" y="1608" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1A1A1A">renewal ≥ 3 months before expiry</text><text x="380" y="1625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#2F5C85">Duy trì: giám sát hằng năm,</text><text x="380" y="1642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#2F5C85">gia hạn ≥ 3 tháng trước khi hết hạn</text><g font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#404040">
    <rect x="20" y="1689" width="14" height="10" fill="#E9EFF8" stroke="#1F3864"/><text x="40" y="1698">Activity / Hoạt động</text>
    <rect x="175" y="1689" width="14" height="10" fill="#FFF2CC" stroke="#B7950B"/><text x="195" y="1698">Gate / Cổng quyết định</text>
    <rect x="360" y="1689" width="14" height="10" fill="#FBE5E5" stroke="#B03A2E"/><text x="380" y="1698">NO-GO / Không đạt – khắc phục</text>
    <rect x="590" y="1689" width="14" height="10" fill="#E2F0D9" stroke="#38761D"/><text x="610" y="1698">Release / Phát hành – đầu ra</text></g>
</svg>