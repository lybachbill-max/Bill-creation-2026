<text x="380" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Type test at GS body</text><text x="380" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">EN ISO 3691-5 · EN 16307-5:2023 · AfPS GS 2019:01 PAK</text>
