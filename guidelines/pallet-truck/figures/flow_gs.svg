<text x="767.5" y="1217.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">Notify GS body BEFORE</text><text x="767.5" y="1234.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">shipment → re-test /</text><text x="767.5" y="1251.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5"  fill="#1A1A1A">amendment / new inspection</text>
<text x="598" y="1223" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#B03A2E">YES</text>
<rect x="180" y="1306" width="400" height="56" rx="28" fill="#E2F0D9" stroke="#38761D" stroke-width="2"/>
<text x="380" y="1330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1A1A1A">Maintain: annual factory surveillance,</text><text x="380" y="1347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1A1A1A">renewal ≥ 3 months before expiry</text><g font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#404040">
