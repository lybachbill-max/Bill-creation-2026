<text x="380" y="966" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">GS certificate issued (ProdSG § 20)</text><text x="380" y="983" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#1A1A1A">Model · brand · factory · validity ≤ 5 years</text>
